plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kanka.telegramsticker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kanka.telegramsticker'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-video:6.0.3'
    implementation 'com.arthenica:smart-exception-java:0.2.1'
}
